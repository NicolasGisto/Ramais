<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>Lista de Ramais</title>
</head>

<body>
    <div class="ramais">
        <div class="menu">
            <img src="./images/logo-1.png" alt="logo.cooperval">
            <div class="menu.links">
                <a href="index.html">Usina</a>
                <a href="escritorio.html">Escritório</a>
            </div>
            <div class="pesquisa">
                <input type="text" id="pesquisaInput" placeholder="🔍 Pesquisar colaborador, setor ou ramal...">
            </div>

        </div>
        <section class="content">
            <div>
                <div class="departamento-card">
                    <div class="departamento-header">
                        <span>🏭 DEPTO. INDÚSTRIA</span>
                    </div>
                    <div id="tbodyDeptoIndustrial" class="departamento-body">
                    </div>
                </div>
                <div class="departamento-card">
                    <div class="departamento-header">
                        <span>🤝 ASSISTÊNCIA SOCIAL</span>
                    </div>
                    <div id="tbodySocial" class="departamento-body"></div>
                </div>
                <div class="departamento-card">
                    <div class="departamento-header">
                        <span>💼 ESCRITÓRIO DE FATURAMENTO</span>
                    </div>
                    <div id="tbodyFat" class="departamento-body">
                    </div>
                </div>
            </div>
            <div>
                <div class="departamento-card">
                    <div class="departamento-header">
                        <span>🌾 DEP. AGRÍCOLA </span>
                    </div>
                    <div id="tbodyAgr" class="departamento-body">
                    </div>
                </div>
                <div class="departamento-card">
                    <div class="departamento-header">
                        <span>📦 ALMOXARIFADO / DEPTO. COMPRAS</span>
                    </div>
                    <div id="tbodyCompras" class="departamento-body">
                    </div>
                </div>
                <div class="departamento-card">
                    <div class="departamento-header">
                        <span>🃏 CARTÃO PONTO / RH</span>
                    </div>
                    <div id="tbodyCponto" class="departamento-body">
                    </div>
                </div>
                <div class="departamento-card">
                    <div class="departamento-header">
                        <span>🍽️ REFEITÓRIO</span>
                    </div>
                    <div id="tbodyRef" class="departamento-body">
                    </div>
                </div>
                <div class="departamento-card">
                    <div class="departamento-header">
                        <span>🛡️ TÉCNICOS DE SEGURANÇA</span>
                    </div>
                    <div id="tbodyTecseg" class="departamento-body">
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
